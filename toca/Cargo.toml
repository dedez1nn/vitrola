[package]
name = "toca"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "vitrola"
path = "src/main.rs"

[dependencies]
async-channel = "2.5.0"
gtk4 = { version = "0.11.5", features = ["v4_12"] }
libc = "0.2.191"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
ureq = "3.5.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
